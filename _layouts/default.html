    <script>
      // Set the active theme on <html> before paint to avoid a flash.
      // The data-theme value MUST match a [data-theme="…"] block in
      // assets/css/theme.css — otherwise no var(--token) resolves and
      // the page renders unstyled. We validate against KNOWN_THEMES and
      // fall back to the default for anything else (e.g. a stale
      // localStorage value from a previous deploy).
      //
      // When you add a new theme: list its name in KNOWN_THEMES and ship
      // a matching [data-theme="…"] block in assets/css/theme.css.
      (function() {
        var KNOWN_THEMES = ['ct-dark'];
        var DEFAULT_THEME = 'ct-dark';
        try {
          var stored = localStorage.getItem('theme');
          var theme = (stored && KNOWN_THEMES.indexOf(stored) !== -1) ? stored : DEFAULT_THEME;
          document.documentElement.setAttribute('data-theme', theme);
          if (stored !== theme) localStorage.setItem('theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', DEFAULT_THEME);
        }
      })();
    </script>

<style>
    * {
        font-family: 'Fira Code', monospace !important;
        box-sizing: border-box;
    }
    
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Fira Code', monospace !important;
    }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
    }
    
    p, h1, h2, h3, h4, h5, h6, a, span, div {
        font-family: 'Fira Code', monospace !important;
    }
    
    div.highlight {
        border-radius: 10px;
    }
    
    .page-wrapper {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
    }
    
    .container {
        flex: 1 0 auto;
    }
    
    footer {
        flex-shrink: 0;
        margin-top: auto;
    }
    
    .buttonCenter {
        display:block;
        position:absolute;
        left:50%;
        transform: translate(-50%, -250%);
    }

    /* Base body — picks up theme tokens */
    html, body {
        background-color: var(--base);
        color: var(--text);
    }

    ::-webkit-scrollbar {
        width: 8px;
        background: var(--scrollbar-track);
    }
    ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
    }

    /* Header logo responsivo */
    .header-logo {
        width: 100%;
        max-width: 400px;
        height: auto;
        background-color: var(--shell-bg-overlay-subtle);
        border-radius: 10px;
        padding: 10px;
        object-fit: contain;
    }

    /* Override code keyword color for dark backgrounds with higher specificity */
    .highlight code .kd,
    .highlight .kd {
        color: var(--peach) !important;
        font-weight: bold !important;
    }

    .highlight code .kc,
    .highlight .kc {
        color: var(--peach) !important;
        font-weight: bold !important;
    }
    
    /* Responsividade para o header */
    @media (max-width: 768px) {
        #main-header header div {
            height: 120px !important;
        }
        
        .header-logo {
            max-width: 280px !important;
            padding: 8px !important;
        }
        
        /* Ajusta o spacer para mobile */
        div[style*="height: 190px"] {
            height: 160px !important;
        }
        
        /* Ajustes do menu de navegação */
        nav {
            top: 120px !important;
        }
        
        footer {
            padding: 20px 0 !important;
        }
        
        footer > div {
            padding: 0 15px !important;
        }
        
        footer a {
            margin: 0 8px !important;
            font-size: 0.85em !important;
        }
        
    }
    
    @media (max-width: 480px) {
        #main-header header div {
            height: 100px !important;
        }
        
        .header-logo {
            max-width: 220px !important;
            padding: 5px !important;
        }
        
        /* Ajusta o spacer geral para acomodar o menu */
        div[style*="height: 190px"] {
            height: 140px !important;
        }
        
        /* Ajustes do menu de navegação */
        nav {
            top: 100px !important;
        }
        
        nav a {
            padding: 8px 10px !important;
            font-size: 0.85em !important;
        }
        
        footer {
            padding: 15px 0 !important;
        }
        
        footer > div {
            padding: 0 10px !important;
        }
        
        footer a {
            margin: 0 5px !important;
            font-size: 0.8em !important;
            display: inline-block;
            margin-bottom: 5px;
        }
        
        /* Links do footer em linha para telas muito pequenas */
        footer > div > div:first-child {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
    }
    
    @media (max-width: 360px) {
        .header-logo {
            max-width: 180px !important;
            padding: 3px !important;
        }
        
        #main-header header div {
            height: 80px !important;
        }
        
        nav {
            top: 80px !important;
        }
        
        div[style*="height: 190px"] {
            height: 120px !important;
        }
        
        nav a {
            padding: 6px 8px !important;
            font-size: 0.8em !important;
        }
        
        footer a {
            font-size: 0.75em !important;
        }
    }
    
    /* Container responsivo */
    .container {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
    }
    /* Quebra de linha para links longos */
    #main_content a, .language-plaintext {
        word-wrap: break-word !important;
        word-break: break-word !important;
        overflow-wrap: break-word !important;
        hyphens: auto !important;
    }

    @media (max-width: 768px) {
        .container {
            padding: 0 15px;
        }
    }
    
    @media (max-width: 480px) {
        .container {
            padding: 0 10px;
        }
    }
</style>

  <body>
    
    <div class="page-wrapper">
        <div id="main-header">
<header style="position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background-color: var(--shell-bg-overlay); transition: transform 0.3s ease-in-out;">

<!--          <a href="{{ '/about/' | relative_url }}" style="padding: 10px 15px; color: var(--shell-accent); text-decoration: none; font-size: 0.9em;">About</a> -->
                    <div class="theme-menu">

    <!-- Footer -->
    <footer style="background-color: var(--shell-bg); padding: 30px 0; margin-top: auto; border-top: 1px solid var(--shell-border); width: 100%;">
      <div style="max-width: 1100px; margin: 0 auto; text-align: center; padding: 0 20px;">
        <div style="margin-bottom: 20px;">
          <a href="https://twitter.com/ctbbpodcast" target="_blank" rel="noopener" style="color: var(--shell-accent); text-decoration: none; margin: 0 10px; font-size: 0.9em;">Twitter</a>
          <a href="https://github.com/criticalthinkingpodcast/criticalthinkingpodcast.github.io" target="_blank" rel="noopener" style="color: var(--shell-accent); text-decoration: none; margin: 0 10px; font-size: 0.9em;">GitHub</a>
          <a href="https://lab.ctbb.show/feed.xml" target="_blank" rel="noopener" style="color: var(--shell-accent); text-decoration: none; margin: 0 10px; font-size: 0.9em;">RSS Feed</a>
          <a href="mailto:contact@criticalthinkingpodcast.com" style="color: var(--shell-accent); text-decoration: none; margin: 0 10px; font-size: 0.9em;">Contact</a>

          &copy; Critical Thinking: A Bug Bounty Podcast. All rights reserved.

    <!-- Back to Top Button -->
    <div id="backToTop" style="position: fixed; bottom: 20px; right: 20px; background-color: var(--shell-bg-overlay-subtle); color: var(--shell-accent); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0; transition: opacity 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 100; border: 1px solid var(--shell-border);">
        <div style="font-size: 20px;">&uarr;</div>
    </div>
    
    <script>
        // Initialize plexus animation with better settings for header background
        document.addEventListener("DOMContentLoaded", function() {
            var plexus = new Plexus("plexus-test", {
                pointsSpeed: 0.3,
                pointsRadius: 1.0,
                pointsStartDistance: 80,
                linesWidth: 0.8,
                backgroundColor: "rgba(24, 24, 24, 0)"
            });

            // Theme menu dropdown — opens/closes a small popover.
            // (Bound first so any later DOM error can't block it.)
            var themeToggle = document.getElementById('theme-toggle');
            var themeMenuDropdown = document.getElementById('theme-menu-dropdown');
            if (themeToggle && themeMenuDropdown) {
                var closeThemeMenu = function() {
                    themeMenuDropdown.hidden = true;
                    themeToggle.setAttribute('aria-expanded', 'false');
                };
                themeToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var willOpen = themeMenuDropdown.hidden;
                    themeMenuDropdown.hidden = !willOpen;
                    themeToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
                });
                themeMenuDropdown.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
                document.addEventListener('click', closeThemeMenu);
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeThemeMenu();
                });
            }

            // Header hide/show on scroll
            let lastScrollTop = 0;
            const header = document.getElementById('main-header');
            const nav = document.querySelector('nav');
            const backToTopButton = document.getElementById('backToTop');

            window.addEventListener('scroll', function() {
                let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    // Scrolling down - hide header
                    header.style.transform = 'translateY(-100%)';
                    nav.style.transform = 'translateY(-100%)';
                } else {
                    // Scrolling up - show header
                    header.style.transform = 'translateY(0)';
                    nav.style.transform = 'translateY(0)';
                }

                lastScrollTop = scrollTop;

                // Back to top button logic
                if (backToTopButton) {
                    backToTopButton.style.opacity = window.pageYOffset > 300 ? '1' : '0';
                }
            });

            // Scroll to top when clicked
            if (backToTopButton) {
                backToTopButton.addEventListener('click', function() {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });
            }

        });
    </script>
  </body>
