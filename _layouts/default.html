    <script>
      /* ================================================================
         THEME REGISTRY — the single source of truth.
         Add a theme: append one entry below + the matching
         [data-theme="<id>"] block in assets/css/theme.css. That's it.
         The picker dropdown renders itself from this list.
         ================================================================ */
      window.SITE_THEMES = [
        { id: 'ct-dark', label: 'CT Dark' },
        { id: 'ct-noir', label: 'CT Noir' },
        { id: 'ivory', label: 'ivory' },
        { id: 'paperwhite', label: 'paperwhite' },
        { id: 'solar-flare', label: 'solar-flare' },
        { id: 'rose-quartz', label: 'rose-quartz' },
        { id: 'clay', label: 'clay' },
        { id: 'graphite', label: 'graphite' },
        { id: 'mint-paper', label: 'mint-paper' },
        { id: 'phosphor-green', label: 'phosphor-green' },
        { id: 'outrun', label: 'outrun' },
        { id: 'abyss', label: 'abyss' },
        { id: 'amber-crt', label: 'amber-crt' },
        { id: 'blood-moon', label: 'blood-moon' },
        { id: 'dracula-night', label: 'dracula-night' },
        { id: 'latte', label: 'latte' },
        { id: 'rose-pine-dawn', label: 'rose-pine-dawn' },
        { id: 'solarized-light', label: 'solarized-light' },
        { id: 'gruvbox-light', label: 'gruvbox-light' },
        { id: 'github-light', label: 'github-light' },
        { id: 'ayu-light', label: 'ayu-light' },
        { id: 'everforest-light', label: 'everforest-light' },
        { id: 'paper-color', label: 'paper-color' },
        { id: 'tokyo-day', label: 'tokyo-day' },
        { id: 'iceberg-light', label: 'iceberg-light' },
        { id: 'min-light', label: 'min-light' },
        { id: 'selene', label: 'selene' },
        { id: 'lapis', label: 'lapis' },
        { id: 'dayfox', label: 'dayfox' },
        { id: 'horizon-light', label: 'horizon-light' },
        { id: 'bear', label: 'bear' },
        { id: 'tokyo-night', label: 'tokyo-night' },
        { id: 'gruvbox-dark', label: 'gruvbox-dark' },
        { id: 'rose-pine-moon', label: 'rose-pine-moon' },
        { id: 'everforest-dark', label: 'everforest-dark' }
      ];
      window.DEFAULT_THEME = 'ct-dark';

      // FOUC-safe theme application (runs before paint).
      (function() {
        var known = window.SITE_THEMES.map(function(t) { return t.id; });
        var fallback = window.DEFAULT_THEME;
        try {
          var stored = localStorage.getItem('theme');
          var theme = (stored && known.indexOf(stored) !== -1) ? stored : fallback;
          document.documentElement.setAttribute('data-theme', theme);
          if (stored !== theme) localStorage.setItem('theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', fallback);
        }
      })();
    </script>

<style>
    * {
        font-family: 'Fira Code', monospace !important;
        box-sizing: border-box;
    }
    
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Fira Code', monospace !important;
    }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        position: relative;
    }
    
    p, h1, h2, h3, h4, h5, h6, a, span, div {
        font-family: 'Fira Code', monospace !important;
    }
    
    div.highlight {
        border-radius: 10px;
    }
    
    .page-wrapper {
        flex: 1 0 auto;
        display: flex;
        flex-direction: column;
    }
    
    .container {
        flex: 1 0 auto;
    }
    
    footer {
        flex-shrink: 0;
        margin-top: auto;
    }
    
    .buttonCenter {
        display:block;
        position:absolute;
        left:50%;
        transform: translate(-50%, -250%);
    }

    /* Base body — picks up theme tokens */
    html, body {
        background-color: var(--base);
        color: var(--text);
    }

    ::-webkit-scrollbar {
        width: 8px;
        background: var(--scrollbar-track);
    }
    ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
    }

    /* Header logo — JS sets the .src attribute based on the active
       theme's --shell-bg luminance (or --logo-image override).
       Direct .src mutation re-renders reliably when themes flip. */
    .header-logo {
        width: 100%;
        max-width: 400px;
        height: auto;
        background-color: transparent;
        border-radius: 10px;
        padding: 10px;
        object-fit: contain;
    }

    /* Override code keyword color for dark backgrounds with higher specificity */
    .highlight code .kd,
    .highlight .kd {
        color: var(--peach) !important;
        font-weight: bold !important;
    }

    .highlight code .kc,
    .highlight .kc {
        color: var(--peach) !important;
        font-weight: bold !important;
    }
    
    /* Responsividade para o header */
    @media (max-width: 768px) {
        #main-header header div {
            height: 120px !important;
        }
        
        .header-logo {
            max-width: 280px !important;
            padding: 8px !important;
        }
        
        /* Ajusta o spacer para mobile */
        div[style*="height: 190px"] {
            height: 160px !important;
        }
        
        /* Ajustes do menu de navegação */
        nav {
            top: 120px !important;
        }
        
        footer {
            padding: 20px 0 !important;
        }
        
        footer > div {
            padding: 0 15px !important;
        }
        
        footer a {
            margin: 0 8px !important;
            font-size: 0.85em !important;
        }
        
    }
    
    @media (max-width: 480px) {
        #main-header header div {
            height: 100px !important;
        }
        
        .header-logo {
            max-width: 220px !important;
            padding: 5px !important;
        }
        
        /* Ajusta o spacer geral para acomodar o menu */
        div[style*="height: 190px"] {
            height: 140px !important;
        }
        
        /* Ajustes do menu de navegação */
        nav {
            top: 100px !important;
        }
        
        nav a {
            padding: 8px 10px !important;
            font-size: 0.85em !important;
        }
        
        footer {
            padding: 15px 0 !important;
        }
        
        footer > div {
            padding: 0 10px !important;
        }
        
        footer a {
            margin: 0 5px !important;
            font-size: 0.8em !important;
            display: inline-block;
            margin-bottom: 5px;
        }
        
        /* Links do footer em linha para telas muito pequenas */
        footer > div > div:first-child {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }
    }
    
    @media (max-width: 360px) {
        .header-logo {
            max-width: 180px !important;
            padding: 3px !important;
        }
        
        #main-header header div {
            height: 80px !important;
        }
        
        nav {
            top: 80px !important;
        }
        
        div[style*="height: 190px"] {
            height: 120px !important;
        }
        
        nav a {
            padding: 6px 8px !important;
            font-size: 0.8em !important;
        }
        
        footer a {
            font-size: 0.75em !important;
        }
    }
    
    /* Container responsivo */
    .container {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
    }
    /* Quebra de linha para links longos */
    #main_content a, .language-plaintext {
        word-wrap: break-word !important;
        word-break: break-word !important;
        overflow-wrap: break-word !important;
        hyphens: auto !important;
    }

    @media (max-width: 768px) {
        .container {
            padding: 0 15px;
        }
    }
    
    @media (max-width: 480px) {
        .container {
            padding: 0 10px;
        }
    }

    <script>
        // Initialize plexus animation with better settings for header background
        document.addEventListener("DOMContentLoaded", function() {
            var plexus = new Plexus("plexus-test", {
                pointsSpeed: 0.3,
                pointsRadius: 1.0,
                pointsStartDistance: 80,
                linesWidth: 0.8,
                backgroundColor: "rgba(24, 24, 24, 0)"
            });

            // ── Logo auto-picker ─────────────────────────────────────
            // Reads --shell-bg + --logo-image for a given theme via a
            // hidden probe element. If the theme sets --logo-image, use
            // that. Otherwise pick light or dark variant by luminance.
            function parseColorToRGB(str) {
                str = (str || '').trim();
                if (str.charAt(0) === '#') {
                    var hex = str.slice(1);
                    if (hex.length === 3) {
                        hex = hex.split('').map(function(c) { return c + c; }).join('');
                    }
                    return [parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)];
                }
                var m = str.match(/rgba?\(([^)]+)\)/);
                if (m) {
                    var parts = m[1].split(',').map(function(p) { return parseFloat(p.trim()); });
                    return [parts[0] || 0, parts[1] || 0, parts[2] || 0];
                }
                return [0, 0, 0];
            }
            function relativeLuminance(rgb) {
                var lin = rgb.map(function(v) {
                    v = v / 255;
                    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
                });
                return 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
            }
            function pickLogoForTheme(themeName) {
                var probe = document.createElement('div');
                probe.setAttribute('data-theme', themeName);
                probe.style.cssText = 'position:fixed;left:-9999px;width:0;height:0;visibility:hidden;pointer-events:none;';
                document.body.appendChild(probe);
                var style = getComputedStyle(probe);
                var explicit = style.getPropertyValue('--logo-image').trim();
                var shellBg = style.getPropertyValue('--shell-bg').trim();
                document.body.removeChild(probe);
                if (explicit) {
                    // Strip the CSS url("…") / url(…) wrapper to a raw path.
                    var m = explicit.match(/^url\((['"]?)([^'")]+)\1\)$/);
                    return m ? m[2] : explicit;
                }
                var lum = relativeLuminance(parseColorToRGB(shellBg));
                return lum > 0.5
                    ? '/assets/images/CTLogo_LightBG.png'
                    : '/assets/images/CTLogo.png';
            }
            function applyThemeLogo(themeName) {
                var url = pickLogoForTheme(themeName);
                var logo = document.querySelector('.header-logo');
                if (logo && logo.getAttribute('src') !== url) {
                    logo.src = url;
                }
            }

            // Theme menu dropdown — opens/closes + theme selection.
            // (Bound first so any later DOM error can't block it.)
            var themeToggle = document.getElementById('theme-toggle');
            var themeMenuDropdown = document.getElementById('theme-menu-dropdown');
            if (themeToggle && themeMenuDropdown) {
                // Render dropdown options from window.SITE_THEMES.
                var optionsContainer = document.getElementById('theme-options-container');
                if (optionsContainer && window.SITE_THEMES) {
                    optionsContainer.innerHTML = '';
                    var makeOption = function(t) {
                        var btn = document.createElement('button');
                        btn.className = 'theme-option';
                        btn.type = 'button';
                        btn.setAttribute('role', 'menuitemradio');
                        btn.setAttribute('data-theme-value', t.id);
                        btn.innerHTML = '<span class="theme-option-preview" aria-hidden="true"></span><span class="theme-option-label"></span>';
                        btn.querySelector('.theme-option-label').textContent = t.label;
                        return btn;
                    };
                    // Sort CT (default) themes first, then alphabetical by
                    // label — the registry stays append-only and any new
                    // theme slots into place automatically.
                    var sorted = window.SITE_THEMES.slice().sort(function(a, b) {
                        var aCT = /^ct-/i.test(a.id), bCT = /^ct-/i.test(b.id);
                        if (aCT !== bCT) return aCT ? -1 : 1;
                        return a.label.localeCompare(b.label);
                    });
                    // Group into dark / light columns by each theme's --base
                    // luminance (probed live, so no hardcoded list to maintain).
                    var darkCol = [], lightCol = [];
                    sorted.forEach(function(t) {
                        var probe = document.createElement('div');
                        probe.setAttribute('data-theme', t.id);
                        probe.style.cssText = 'position:fixed;left:-9999px;width:0;height:0;visibility:hidden;pointer-events:none;';
                        document.body.appendChild(probe);
                        var base = getComputedStyle(probe).getPropertyValue('--base').trim();
                        document.body.removeChild(probe);
                        (relativeLuminance(parseColorToRGB(base)) > 0.5 ? lightCol : darkCol).push(t);
                    });
                    [['Dark', darkCol], ['Light', lightCol]].forEach(function(group) {
                        var col = document.createElement('div');
                        col.className = 'theme-column';
                        var title = document.createElement('div');
                        title.className = 'theme-column-title';
                        title.textContent = group[0];
                        col.appendChild(title);
                        group[1].forEach(function(t) { col.appendChild(makeOption(t)); });
                        optionsContainer.appendChild(col);
                    });
                }

                var closeThemeMenu = function() {
                    themeMenuDropdown.hidden = true;
                    themeToggle.setAttribute('aria-expanded', 'false');
                };
                var markActiveOption = function() {
                    var current = document.documentElement.getAttribute('data-theme');
                    themeMenuDropdown.querySelectorAll('.theme-option').forEach(function(btn) {
                        btn.classList.toggle('is-active', btn.getAttribute('data-theme-value') === current);
                        btn.setAttribute('aria-checked', btn.getAttribute('data-theme-value') === current ? 'true' : 'false');
                    });
                };
                // Generate each option's preview swatch from its theme tokens.
                // A hidden probe element with [data-theme="…"] makes the
                // theme's CSS variables resolvable via getComputedStyle().
                var paintOptionPreviews = function() {
                    themeMenuDropdown.querySelectorAll('.theme-option').forEach(function(btn) {
                        var name = btn.getAttribute('data-theme-value');
                        var preview = btn.querySelector('.theme-option-preview');
                        if (!name || !preview) return;
                        var probe = document.createElement('div');
                        probe.setAttribute('data-theme', name);
                        probe.style.position = 'fixed';
                        probe.style.left = '-9999px';
                        probe.style.width = '0';
                        probe.style.height = '0';
                        probe.style.visibility = 'hidden';
                        probe.style.pointerEvents = 'none';
                        document.body.appendChild(probe);
                        var style = getComputedStyle(probe);
                        var bg = style.getPropertyValue('--base').trim();
                        var accent = style.getPropertyValue('--blue').trim();
                        document.body.removeChild(probe);
                        if (bg && accent) {
                            preview.style.background = 'linear-gradient(135deg, ' + bg + ' 0%, ' + bg + ' 50%, ' + accent + ' 50%, ' + accent + ' 100%)';
                        }
                    });
                };
                paintOptionPreviews();
                themeToggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var willOpen = themeMenuDropdown.hidden;
                    themeMenuDropdown.hidden = !willOpen;
                    themeToggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
                    if (willOpen) markActiveOption();
                });
                themeMenuDropdown.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
                themeMenuDropdown.querySelectorAll('.theme-option').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var theme = btn.getAttribute('data-theme-value');
                        if (!theme) return;
                        document.documentElement.setAttribute('data-theme', theme);
                        try { localStorage.setItem('theme', theme); } catch (e) {}
                        applyThemeLogo(theme);
                        markActiveOption();
                        // Desktop: keep the menu open so themes can be browsed
                        // by clicking through them; it closes on an outside
                        // click. Mobile: close on select so the dropdown (which
                        // can fill the screen) doesn't trap the user.
                        if (window.matchMedia('(max-width: 768px)').matches) {
                            closeThemeMenu();
                        }
                    });
                });
                document.addEventListener('click', closeThemeMenu);
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') closeThemeMenu();
                });
                markActiveOption();
            }

            // Apply the right logo for the active theme on first paint.
            applyThemeLogo(document.documentElement.getAttribute('data-theme') || 'ct-dark');

            // Header hide/show on scroll
            let lastScrollTop = 0;
            const header = document.getElementById('main-header');
            const nav = document.querySelector('nav');
            const backToTopButton = document.getElementById('backToTop');

            window.addEventListener('scroll', function() {
                let scrollTop = window.pageYOffset || document.documentElement.scrollTop;

                if (scrollTop > lastScrollTop && scrollTop > 100) {
                    // Scrolling down - hide header
                    header.style.transform = 'translateY(-100%)';
                    nav.style.transform = 'translateY(-100%)';
                } else {
                    // Scrolling up - show header
                    header.style.transform = 'translateY(0)';
                    nav.style.transform = 'translateY(0)';
                }

                lastScrollTop = scrollTop;

                // Back to top button logic
                if (backToTopButton) {
                    backToTopButton.style.opacity = window.pageYOffset > 300 ? '1' : '0';
                }
            });

            // Scroll to top when clicked
            if (backToTopButton) {
                backToTopButton.addEventListener('click', function() {
                    window.scrollTo({
                        top: 0,
                        behavior: 'smooth'
                    });
                });
            }

        });
    </script>
